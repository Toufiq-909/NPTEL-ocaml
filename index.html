<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCaml Weekly Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <header class="topbar">
      <a class="brand" href="#" aria-label="OCaml quiz home"><span class="brand-mark">λ</span><span>OCaml<span class="thin">/</span>Weekly</span></a>
      <div class="top-status"><span class="pulse"></span><span>12 quizzes ready</span></div>
    </header>
    <main>
      <section id="homeView" class="home-view">
        <div class="intro">
          <p class="eyebrow">FUNCTIONAL PROGRAMMING WITH OCAML</p>
          <h1>Make every week<br /><em>click.</em></h1>
          <p class="intro-copy">Twelve focused practice quizzes drawn from your course sections. Pick a week, answer at your own pace, and see where you stand.</p>
          <div class="intro-meta"><span>12 WEEKS</span><i></i><span>120 QUESTIONS</span><i></i><span>INSTANT FEEDBACK</span></div>
        </div>
        <div class="week-grid" id="weekGrid"></div>
      </section>

      <section id="quizView" class="quiz-view hidden" aria-live="polite">
        <button class="back-button" id="backButton"><span>←</span> All weeks</button>
        <div class="quiz-shell">
          <aside class="quiz-side">
            <div class="week-number" id="quizWeekNumber">01</div>
            <p class="eyebrow" id="quizEyebrow">WEEK 1</p>
            <h2 id="quizTitle">Foundations</h2>
            <p id="quizDescription"></p>
            <div class="progress-label"><span>PROGRESS</span><strong id="progressText">1 / 3</strong></div>
            <div class="progress-track"><div id="progressBar"></div></div>
            <div class="question-dots" id="questionDots"></div>
          </aside>
          <div class="question-panel" id="questionPanel"></div>
        </div>
      </section>
    </main>
    <template id="weekCardTemplate">
      <button class="week-card"><div class="card-top"><span class="week-label"></span><span class="arrow">↗</span></div><h2></h2><p></p><div class="card-bottom"><span class="question-total"></span><span class="start-text">START QUIZ</span></div></button>
    </template>
    <script src="pasted-questions.js"></script>
    <script src="week3-questions.js"></script>
    <script src="week7-questions.js"></script>
    <script src="weeks8to12-questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
